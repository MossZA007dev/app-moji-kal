<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B8B"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Rounded Squircle -->
  <rect width="100" height="100" rx="28" fill="url(#bg)"/>
  
  <!-- Sparkles -->
  <path d="M 78 16 Q 78 22 84 22 Q 78 22 78 28 Q 78 22 72 22 Q 78 22 78 16" fill="#FFF275"/>
  <circle cx="20" cy="25" r="2.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Strawberry hat -->
  <path d="M 50 25 C 44 25 42 32 50 35 C 58 32 56 25 50 25 Z" fill="#FF4757"/>
  <path d="M 50 22 C 48 24 49 26 50 26 C 51 26 52 24 50 22 Z" fill="#2ED573"/>

  <!-- Mochi Body -->
  <ellipse cx="50" cy="58" rx="33" ry="26" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Cheeks -->
  <ellipse cx="32" cy="60" rx="5.5" ry="3.5" fill="#FF7899" opacity="0.6"/>
  <ellipse cx="68" cy="60" rx="5.5" ry="3.5" fill="#FF7899" opacity="0.6"/>

  <!-- Kawaii Eyes -->
  <circle cx="38" cy="53" r="3.6" fill="#37262D"/>
  <circle cx="37" cy="51.5" r="1.3" fill="#FFFFFF"/>
  <circle cx="62" cy="53" r="3.6" fill="#37262D"/>
  <circle cx="61" cy="51.5" r="1.3" fill="#FFFFFF"/>

  <!-- Happy Smile -->
  <path d="M 47 61 Q 50 64 53 61" stroke="#37262D" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
