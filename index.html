function applyQuickDish(dishName) {
  const dish = POPULAR_THAI_DISHES.find(d => d.name === dishName);
  if (!dish || !draft) return;
  draft.name = dish.name;
  draft.txt = dish.name;
  draft.kcal = dish.kcal;
  draft.sugar = dish.sugar;
  draft.isDrink = dish.isDrink;
  draft.components = JSON.parse(JSON.stringify(dish.components));
  draft.showArPins = true;
  draft.status = `✨ เลือกเมนู "${dish.name}" (${dish.kcal} kcal)`;
  renderSheet();
}

function onFoodSearchInput(val) {
  if (!draft) return;
  draft.name = val;
  draft.txt = val;

  const wasEmpty = !$('#sheet .simple-food-card');
  const lower = val.trim().toLowerCase();
  const matched = POPULAR_THAI_DISHES.find(d => 
    d.name.toLowerCase().includes(lower) || 
    (lower.length >= 2 && (
      (lower.includes('กะเพรา') && d.name.includes('กะเพรา')) ||
      (lower.includes('ข้าวมันไก่') && d.name.includes('ข้าวมันไก่')) ||
      (lower.includes('ชานม') && d.name.includes('ชานม')) ||
      (lower.includes('ชาไทย') && d.name.includes('ชาไทย')) ||
      (lower.includes('ชาเขียว') && d.name.includes('ชาเขียว')) ||
      (lower.includes('อเมริกาโน่') && d.name.includes('อเมริกาโน่')) ||
      (lower.includes('ลาเต้') && d.name.includes('ลาเต้')) ||
      (lower.includes('ส้มตำ') && d.name.includes('ส้มตำ')) ||
      (lower.includes('สุกี้') && d.name.includes('สุกี้')) ||
      (lower.includes('ผัดไทย') && d.name.includes('ผัดไทย'))
    ))
  );

  if (matched && (!draft.kcal || draft.autoMatched !== matched.name)) {
    draft.autoMatched = matched.name;
    draft.kcal = matched.kcal;
    draft.sugar = matched.sugar;
    draft.isDrink = matched.isDrink;
    draft.components = JSON.parse(JSON.stringify(matched.components));
    draft.status = `💡 แนะนำตัวเลขของ "${matched.name}" (${matched.kcal} kcal)`;
    const inputEl = document.querySelector('.simple-bar-input');
    const selStart = inputEl ? inputEl.selectionStart : null;
    const selEnd = inputEl ? inputEl.selectionEnd : null;
    renderSheet();
    const newInput = document.querySelector('.simple-bar-input');
    if (newInput && selStart !== null) {
      newInput.focus();
      newInput.setSelectionRange(selStart, selEnd);
    }
  } else if (wasEmpty && val.trim().length === 1) {
    const inputEl = document.querySelector('.simple-bar-input');
    const selStart = inputEl ? inputEl.selectionStart : null;
    const selEnd = inputEl ? inputEl.selectionEnd : null;
    renderSheet();
    const newInput = document.querySelector('.simple-bar-input');
    if (newInput && selStart !== null) {
      newInput.focus();
      newInput.setSelectionRange(selStart, selEnd);
    }
  } else {
    const titleEl = document.querySelector('.simple-dish-title span:nth-child(2)');
    if (titleEl) titleEl.textContent = val || 'มื้ออาหาร';
    draft.isDrink = lower.includes('ชา') || lower.includes('กาแฟ') || lower.includes('นม') || lower.includes('ลาเต้') || lower.includes('น้ำ') || lower.includes('โซดา');
  }
}

function setQuickSweetness(val, grams) {
  if (!draft) return;
  draft.sweetness = val;
  draft.sugar = grams;
  renderSheet();
}

function toggleAdvancedOptions() {
  if (!draft) return;
  draft.showAdvanced = !draft.showAdvanced;
  renderSheet();
}

function fillDraftFromFavorite(favId) {
  const f = favorites.find(x => x.id === favId);
  if (!f || !draft) return;
  draft.name = f.name;
  draft.txt = f.name;
  draft.kcal = f.calorie;
  draft.sugar = f.sugar;
  draft.portion = f.portion_size || 'normal';
  draft.sweetness = f.sweetness_level || 'normal';
  draft.isDrink = f.name.includes('ชา') || f.name.includes('กาแฟ') || f.name.includes('นม');
  draft.status = `✨ เลือกเมนูประจำ "${f.name}" แล้ว`;
  renderSheet();
}

function setPortion(val) {
  if (!draft) return;
  draft.portion = val;
  renderSheet();
}

function setDrinkBrand(brandId) {
  if (!draft) return;
  draft.brand = brandId;
  renderSheet();
}

function applyClarification(optText) {
  draft.txt = (draft.txt ? draft.txt + ' ' : '') + optText;
  if (optText.includes('0%')) draft.sweetness = 'none';
  else if (optText.includes('25%')) draft.sweetness = 'less';
  else if (optText.includes('50%')) draft.sweetness = 'half';
  else if (optText.includes('100%')) draft.sweetness = 'normal';
  draft.clarification = null;
  analyzeMeal();
}

// ============================================================
// In-App Live Camera Stream & Viewfinder Controller
// ============================================================
let cameraStream = null;
let currentCameraFacing = 'environment'; // 'environment' (rear) | 'user' (front)

function openCameraFromToday() {
  if (!draft) openSheet();
  openCameraModal();
}

async function openCameraModal() {
  if (!draft) openSheet();
  const modal = $('#cameraModal');
  if (!modal) return;
  modal.hidden = false;

  // Check WebRTC camera support
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    modal.hidden = true;
    const directInput = $('#directCameraInput');
    if (directInput) {
      directInput.click();
    } else {
      toast('อุปกรณ์นี้ไม่รองรับการเปิดกล้องสดในเบราว์เซอร์ กำลังเปิดกล้องระบบ...');
    }
    return;
  }

  await startCameraStream(currentCameraFacing);
}

async function startCameraStream(facing) {
  const video = $('#cameraVideo');
  if (!video) return;

  stopCameraStream();

  try {
    const constraints = {
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 },
        height: { ideal: 960 }
      },
      audio: false
    };

    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = cameraStream;
    await video.play();
  } catch (err) {
    console.warn('getUserMedia ideal facingMode failed, retrying with basic constraint:', err);
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = cameraStream;
      await video.play();
    } catch (err2) {
      console.error('Camera access denied or failed:', err2);
      closeCameraModal();
      toast('กรุณาอนุญาตสิทธิ์กล้องในเบราว์เซอร์เพื่อถ่ายภาพ 📷');
      const directInput = $('#directCameraInput');
      if (directInput) directInput.click();
    }
  }
}

function stopCameraStream() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => {
      try { track.stop(); } catch (_) {}
    });
    cameraStream = null;
  }
  const video = $('#cameraVideo');
  if (video) video.srcObject = null;
}

function closeCameraModal() {
  stopCameraStream();
  const modal = $('#cameraModal');
  if (modal) modal.hidden = true;
}

async function switchCameraFacing() {
  currentCameraFacing = currentCameraFacing === 'environment' ? 'user' : 'environment';
  await startCameraStream(currentCameraFacing);
  toast(currentCameraFacing === 'environment' ? 'สลับเป็นกล้องหลัง 🍽️' : 'สลับเป็นกล้องหน้า 🤳');
}

function captureCameraPhoto() {
  const video = $('#cameraVideo');
  const canvas = $('#cameraCanvas');
  const flash = $('#cameraFlash');
  if (!video || !canvas) return;

  const w = video.videoWidth || 800;
  const h = video.videoHeight || 600;

  const maxDim = 960;
  const scale = Math.min(1, maxDim / Math.max(w, h));
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);

  const ctx = canvas.getContext('2d');
  if (currentCameraFacing === 'user') {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const base64 = canvas.toDataURL('image/jpeg', 0.85);

  if (flash) {
    flash.classList.add('flashing');
    setTimeout(() => flash.classList.remove('flashing'), 200);
  }

  if (!draft) openSheet();
  draft.imageBase64 = base64;
  draft.status = 'ถ่ายรูปสำเร็จแล้ว! ✨ โมจิกำลังวิเคราะห์อาหาร...';

  setTimeout(() => {
    closeCameraModal();
    renderSheet();
    toast('ถ่ายรูปอาหารสำเร็จ! 📸');
    if (!draft.txt.trim()) {
      analyzeMeal();
    }
  }, 180);
}

function pickImage(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 800;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      if (!draft) openSheet();
      draft.imageBase64 = canvas.toDataURL('image/jpeg', 0.82);
      draft.showArPins = true;
      draft.activePinIdx = null;
      draft.status = 'เลือกรูปแล้ว โมจิกำลังวิเคราะห์อาหาร... 🍡';
      renderSheet();
      if (!draft.txt.trim()) {
        analyzeMeal();
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function analyzeMeal() {
  if (!draft.txt.trim() && !draft.imageBase64) {
    draft.status = 'ใส่รูปภาพหรือพิมพ์ชื่ออาหารก่อนน้า';
    renderSheet();
    return;
  }

  draft.isScanning = true;
  draft.status = 'โมจิกำลังสแกนอาหารและวิเคราะห์แคลอรี... 🍡';
  renderSheet();

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-user-id': currentUser?.id || ''
      },
      body: JSON.stringify({
        userId: currentUser?.id,
        text: draft.txt,
        imageBase64: draft.imageBase64,
        sweetness: draft.sweetness,
        portion: draft.portion,
        brand: draft.brand || 'standard',
        toppings: draft.toppings || []
      })
    });

    if (res.status === 429) {
      const err = await res.json();
      draft.status = `⚠️ ${err.message}`;
      renderSheet();
      return;
    }

    const result = await res.json();
    if (result.is_food === false) {
      draft.name = '';
      draft.kcal = '';
      draft.sugar = '';
      draft.components = null;
      draft.status = result.note;
      toast(result.note);
      renderSheet();
      return;
    }

    draft.name = result.name || draft.name || 'มื้ออาหาร';
    draft.kcal = result.kcal;
    draft.carbs = result.carbs !== undefined ? result.carbs : '';
    draft.sugar = result.sugar;
    draft.sodium = result.sodium !== undefined ? result.sodium : '';
    draft.protein = result.protein !== undefined ? result.protein : '';
    draft.fat = result.fat !== undefined ? result.fat : '';
    draft.sugarFromPreset = false;
    draft.components = result.components || null;
    draft.showArPins = true;
    draft.activePinIdx = null;
    draft.status = `✨ ${result.note}`;

    if (result.needs_clarification && result.clarification_question) {
      draft.clarification = {
        question: result.clarification_question,
        options: result.options
      };
    } else {
      draft.clarification = null;
    }
  } catch (err) {
    draft.status = 'เกิดข้อผิดพลาดในการวิเคราะห์ ลองกรอกตัวเลขเองได้นะ';
  } finally {
    if (draft) {
      draft.isScanning = false;
      renderSheet();
    }
  }
}

async function saveMeal() {
  const name = (draft.name || draft.txt || '').trim();
  const kcal = Number(draft.kcal) || 0;
  const sugar = Number(draft.sugar) || 0;

  if (!name && !kcal) {
    toast('กรุณาระบุชื่อเมนูก่อนบันทึกนะ 🍡');
    return;
  }

  const finalName = name || 'มื้ออาหาร';

  try {
    const mealDate = draft.date || key();
    await fetch('/api/logs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-user-id': currentUser.id },
      body: JSON.stringify({
        userId: currentUser.id,
        date: mealDate,
        name: finalName,
        calorie: kcal,
        sugar,
        carbs: Number(draft.carbs) || 0,
        protein: Number(draft.protein) || 0,
        fat: Number(draft.fat) || 0,
        sodium: Number(draft.sodium) || 0,
        portion_size: draft.portion,
        sweetness_level: draft.sweetness,
        is_private: draft.isPrivate ? 1 : 0,
        image_url: draft.imageBase64 || null,
        components_json: draft.components && draft.components.length ? JSON.stringify(draft.components) : null
      })
    });

    if (draft.saveAsFav) {
      await fetch('/api/favorites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-user-id': currentUser.id },
        body: JSON.stringify({
          userId: currentUser.id,
          name,
          calorie: kcal,
          sugar,
          portion_size: draft.portion,
          sweetness_level: draft.sweetness
        })
      });
      await fetchFavorites();
    }

    fireConfetti();
    closeSheet();
    await fetchLogs();
    await fetchStreak();
    render();

    const totalSugar = currentLogs.reduce((a, b) => a + b.sugar, 0);
    const sp = totalSugar / (currentUser.sugar_goal || 25);
    if (sp >= 0.85 && sp <= 1) {
      sendPushNotification('โมจิเตือนเบาๆ ⚠️', 'วันนี้ใกล้เต็มโควตาน้ำตาลแล้วนะ มื้อต่อไปแนะนำเลือกไม่หวานน้า~');
    } else if (sp > 1) {
      sendPushNotification('โมจิส่งกำลังใจ 🚨', 'น้ำตาลวันนี้เกินเป้าแล้ว ดื่มน้ำเปล่าเพิ่มและค่อยๆ ปรับสมดุลกันนะ');
    }

    if (mealDate !== key()) {
      toast(`บันทึกมื้ออาหารของวันที่ ${mealDate} เรียบร้อยแล้ว 🍡`);
    } else {
      toast(sp > 1 ? 'บันทึกแล้ว แต่น้ำตาลเกินโควตาแล้วนะ 😣' : 'บันทึกมื้ออาหารเรียบร้อยแล้ว 🍡');
    }
  } catch (e) {
    toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

async function deleteMeal(id) {
  if (!confirm('ต้องการลบมื้อนี้ใช่ไหม?')) return;
  try {
    const res = await fetch(`/api/logs/${id}?userId=${currentUser.id}`, {
      method: 'DELETE',
      headers: { 'x-user-id': currentUser.id }
    });
    const data = await res.json();
    await fetchLogs();
    await fetchStreak();
    render();

    if (data.deletedLog) {
      showUndoToast('ลบมื้ออาหารแล้ว', async () => {
        try {
          await fetch('/api/logs/undo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-user-id': currentUser.id },
            body: JSON.stringify({ log: data.deletedLog })
          });
          await fetchLogs();
          await fetchStreak();
          render();
          toast('กู้คืนมื้ออาหารเรียบร้อยแล้ว ✨');
        } catch (err) {
          toast('กู้คืนไม่สำเร็จ');
        }
      });
    } else {
      toast('ลบมื้ออาหารแล้ว');
    }
  } catch (e) {
    toast('ลบไม่สำเร็จ');
  }
}

function selectArPin(idx) {

function toggleArPins() {

function clearDraftPhoto() {
  if (!draft) return;
  draft.imageBase64 = null;
  draft.components = null;
  draft.activePinIdx = null;
  renderSheet();

function addDraftComponent() {
  if (!draft) return;
  const name = prompt('ระบุชื่อวัตถุดิบ/อาหารเพิ่มเติม (เช่น "ไข่ดาว", "หมูสับ", "เห็ด"):');
  if (!name || !name.trim()) return;
  const calStr = prompt(`ระบุแคลอรีสำหรับ "${name.trim()}" (kcal):`, '100');
  const kcal = Math.max(0, Number(calStr) || 0);
  const sugarStr = prompt(`ระบุน้ำตาลสำหรับ "${name.trim()}" (g):`, '0');
  const sugar = Math.max(0, Number(sugarStr) || 0);

  if (!draft.components) draft.components = [];
  const nextX = Math.round(20 + Math.random() * 60);
  const nextY = Math.round(25 + Math.random() * 50);
  draft.components.push({
    name: name.trim(),
    kcal,
    sugar,
    icon: getComponentIcon(name.trim()),
    x: nextX,
    y: nextY
  });

  recalcDraftFromComponents();
  draft.showArPins = true;
  renderSheet();
  toast(`เพิ่ม "${name.trim()}" แล้ว 🍡`);
}

function removeDraftComponent(idx) {
  if (!draft || !draft.components) return;
  draft.components.splice(idx, 1);
  recalcDraftFromComponents();
  renderSheet();
}

function recalcDraftFromComponents() {
  if (!draft || !draft.components || !draft.components.length) return;
  const totalKcal = draft.components.reduce((sum, c) => sum + (Number(c.kcal) || 0), 0);
  const totalCarbs = draft.components.reduce((sum, c) => sum + (Number(c.carbs) || 0), 0);
  const totalSugar = draft.components.reduce((sum, c) => sum + (Number(c.sugar) || 0), 0);
  const totalProtein = draft.components.reduce((sum, c) => sum + (Number(c.protein) || 0), 0);
  const totalFat = draft.components.reduce((sum, c) => sum + (Number(c.fat) || 0), 0);
  draft.kcal = Math.round(totalKcal);
  draft.carbs = Math.round(totalCarbs * 10) / 10;
  draft.sugar = Math.round(totalSugar * 10) / 10;
  draft.protein = Math.round(totalProtein * 10) / 10;
  draft.fat = Math.round(totalFat * 10) / 10;
}

function getComponentIcon(name = '') {
  const n = String(name).toLowerCase();
  if (n.includes('ข้าว')) return '🍚';
  if (n.includes('ไข่')) return '🍳';
  if (n.includes('ไก่')) return '🍗';
  if (n.includes('หมู') || n.includes('เนื้อ') || n.includes('สเต็ก')) return '🥩';
  if (n.includes('กุ้ง') || n.includes('ปลา') || n.includes('ซีฟู้ด')) return '🦐';
  if (n.includes('เส้น') || n.includes('ก๋วยเตี๋ยว') || n.includes('ผัดไทย')) return '🍜';
  if (n.includes('ผัก') || n.includes('ส้มตำ') || n.includes('สลัด')) return '🥗';
  if (n.includes('ชา') || n.includes('มุก') || n.includes('นม') || n.includes('กาแฟ')) return '🧋';
  if (n.includes('ซุป') || n.includes('น้ำซุป') || n.includes('น้ำจิ้ม')) return '🥣';
  if (n.includes('เห็ด')) return '🍄';
  if (n.includes('อโวคาโด') || n.includes('avocado')) return '🥑';
  if (n.includes('ขนมปัง') || n.includes('โทสต์')) return '🍞';
  return '🍽️';
}

                <span class="ar-comp-icon">${c.icon || '🍽️'}</span>
                <div class="ar-comp-info">
                  <span class="ar-comp-name">${esc(c.name)}</span>
                  <div class="ar-comp-sub-macros">
                    <span class="sub-macro">🍞 แป้ง ${fmt(c.carbs || 0)}g</span>
                    <span class="sub-macro">🍬 น้ำตาล ${fmt(c.sugar || 0)}g</span>
                    <span class="sub-macro">🧂 โซเดียม ${fmt(c.sodium || 0)}mg</span>
                    <span class="sub-macro">🥩 โปรตีน ${fmt(c.protein || 0)}g</span>
                    <span class="sub-macro">🥑 ไขมัน ${fmt(c.fat || 0)}g</span>
                  </div>
                </div>
                <div class="ar-comp-cal-badge">
                  <b>${fmt(c.kcal)}</b> <small>kcal</small>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

function showUndoToast(msg, onUndo) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'space-between';
  el.style.gap = '12px';
  el.style.padding = '10px 16px';
  el.style.minWidth = '280px';
  el.innerHTML = `
    <span>${msg}</span>
    <button style="background:var(--accent);color:#fff;border:none;border-radius:12px;padding:5px 12px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;">เลิกทำ (Undo)</button>
  `;
  const btn = el.querySelector('button');
  const timeoutId = setTimeout(() => el.remove(), 6000);
  btn.onclick = () => {
    clearTimeout(timeoutId);
    el.remove();
    if (typeof onUndo === 'function') onUndo();
  };
  document.body.appendChild(el);
}

function shareText() {
  const totalCal = currentLogs.reduce((a, b) => a + b.calorie, 0);
  const totalSugar = currentLogs.reduce((a, b) => a + b.sugar, 0);
  const dateStr = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

  return `🍡 สรุปโภชนาการวันนี้ของ ${currentUser?.nickname} (${dateStr})\n` +
    `🔥 ความสม่ำเสมอ: ${userStreak.current} วันติด!\n` +
    `🔥 แคลอรี: ${Math.round(totalCal)} / ${currentUser?.calorie_goal} kcal\n` +
    `🍬 น้ำตาล: ${fmt(totalSugar)} / ${currentUser?.sugar_goal} g\n\n` +
    (currentLogs.length ? currentLogs.map(l => `• ${l.name} — ${Math.round(l.calorie)} kcal (น้ำตาล ${fmt(l.sugar)} g)`).join('\n') : '(ยังไม่มีบันทึก)') +
    `\n\n— จากแอปโมจินับแคลและน้ำตาล`;
}

async function copyShareText() {
  const text = shareText();
  try {
    await navigator.clipboard.writeText(text);
    toast('คัดลอกข้อความแล้ว ส่งใน LINE กลุ่มได้เลย 💌');
  } catch (e) {
    const a = document.createElement('textarea');
    a.value = text;
    document.body.appendChild(a);
    a.select();
    try { document.execCommand('copy'); } catch (_) {}
    a.remove();
    toast('คัดลอกข้อความแล้ว 💌');
  }
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

// Window Safety Handlers for Hardware Resources & Dialogs
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeCameraModal();
    closeSheet();
  }
});
window.addEventListener('beforeunload', () => {
  stopCameraStream();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    stopCameraStream();
    closeCameraModal();
  }
});

// Initial Boot
(async () => {
  await fetchSettings();
  await fetchUsers();
  await Promise.all([
    fetchLogs(),
    fetchFavorites(),
    fetchStreak(),
    fetchChallenges(),
    fetchChatHistory(),
    fetchActivities(),
    fetchLeaderboard()
  ]);
  render();

  // If first-time visitor with no saved user or onboarding not yet completed
  const savedId = localStorage.getItem('mochi_user_id');
  const hasOnboarded = localStorage.getItem('mochi_onboarded');
  if (!savedId && !hasOnboarded) {
    setTimeout(() => {
      openOnboardingModal({ isNewUser: true });
    }, 400);
  }
})();
</script>
